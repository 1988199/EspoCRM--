name: 测试并发布报价扩展

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'files/**'
      - 'scripts/**'
      - 'tests/calculator.php'
      - 'manifest.json'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: quote-extension-release
  cancel-in-progress: false

jobs:
  test-package-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 准备 PHP 与打包工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli zip
      - name: 验证源码与算价
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find files scripts tests -name '*.php' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find files -name '*.js' -print0)
          python3 -c 'import json,pathlib; [json.loads(p.read_text(encoding="utf-8")) for p in pathlib.Path(".").rglob("*.json")]'
          php tests/calculator.php
      - name: 读取发行版本
        id: version
        run: |
          set -Eeuo pipefail
          VERSION=$(php -r 'echo json_decode(file_get_contents("manifest.json"))->version;')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: 打包安装文件
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          zip -r "dist/quote-management-$VERSION.zip" manifest.json LICENSE files scripts/*.php
          unzip -t "dist/quote-management-$VERSION.zip"
          sha256sum "dist/quote-management-$VERSION.zip" > "dist/quote-management-$VERSION.zip.sha256"
      - name: 发布经过测试的安装包
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -Eeuo pipefail
          TAG="v$VERSION"
          # 正式版本不覆盖：修改已发布源码时必须递增 manifest 版本。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "版本 $TAG 已存在，不覆盖安装包。请递增版本后再发布。" >&2
            exit 1
          fi
          gh release create "$TAG" "dist/quote-management-$VERSION.zip" "dist/quote-management-$VERSION.zip.sha256" \
            --target "$GITHUB_SHA" --title "报价单管理 $VERSION" --notes-file RELEASE_NOTES.md
          echo "已通过语法、JSON 与算价测试，发布 $TAG 安装包。不会自动安装到 CRM。" >> "$GITHUB_STEP_SUMMARY"
